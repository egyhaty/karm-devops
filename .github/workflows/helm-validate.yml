name: Helm validation

on:
  pull_request:
  push:
    branches:
      - main
      - ci-hardening
      - ci-hardening-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render Helm releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint charts

      - name: Render Go profile
        run: helm template karm-go charts -f charts/values-go.yaml > rendered-go.yaml

      - name: Render Node.js profile
        run: helm template karm-node charts -f charts/values-node.yaml > rendered-node.yaml

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Validate Go profile
        run: kubeconform -strict -summary -output text rendered-go.yaml

      - name: Validate Node.js profile
        run: kubeconform -strict -summary -output text rendered-node.yaml
