name: Helm validation

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-validate.yml'

permissions:
  contents: read

concurrency:
  group: helm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and render Helm releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Go values
        run: helm lint charts -f charts/values-go.yaml

      - name: Render Go manifests
        run: helm template golang charts -f charts/values-go.yaml > /dev/null

      - name: Lint Node.js values
        run: helm lint charts -f charts/values-node.yaml

      - name: Render Node.js manifests
        run: helm template nodejs charts -f charts/values-node.yaml > /dev/null
