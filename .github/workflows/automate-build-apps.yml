name: Build and Promote Applications

on:
  push:
    branches:
      - main
    paths:
      - 'golang/**'
      - 'nodejs/**'
      - '.github/workflows/automate-build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-promote-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Prepare image tag
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-nodejs:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Node.js image
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          file: ./nodejs/Dockerfile
          push: true
          tags: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=nodejs
          cache-to: type=gha,mode=max,scope=nodejs

  build-golang:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Go image
        uses: docker/build-push-action@v7
        with:
          context: ./golang
          file: ./golang/Dockerfile
          push: true
          tags: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=golang
          cache-to: type=gha,mode=max,scope=golang

  update-helm-values:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-nodejs
      - build-golang
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase on latest main
        run: git pull --rebase origin main
      - name: Update Helm image tags
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          for file in charts/values-node.yaml charts/values-go.yaml; do
            sed -i -E \
              "s|^([[:space:]]*tag:[[:space:]]*).*|\1\"sha-${SHORT_SHA}\"|" \
              "$file"
          done
      - name: Commit and push Helm values
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/values-node.yaml charts/values-go.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "chore: update image tags to sha-${SHORT_SHA} [skip ci]"
          git push origin HEAD:main
