name: Build and Promote Applications

on:
  push:
    branches:
      - main
    paths:
      - 'golang/**'
      - 'scripts/check-learning-content.sh'
      - 'nodejs/**'
      - '.github/workflows/automate-build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-promote-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Prepare image tag
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-nodejs:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Node.js image
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          file: ./nodejs/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=nodejs
          cache-to: type=gha,mode=max,scope=nodejs
      - name: Smoke test Node.js image
        env:
          IMAGE: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          APP_TAG: sha-${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f nodejs-smoke nodejs-postgres >/dev/null 2>&1 || true; docker network rm nodejs-smoke-net >/dev/null 2>&1 || true' EXIT
          db_password="$(openssl rand -hex 24)"
          admin_token="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$admin_token"
          docker network create nodejs-smoke-net
          docker run -d --name nodejs-postgres --network nodejs-smoke-net -e POSTGRES_PASSWORD="$db_password" -e POSTGRES_DB=makan postgres:18.6-alpine
          for attempt in {1..30}; do
            if docker exec nodejs-postgres pg_isready -U postgres -d makan; then break; fi
            sleep 1
          done
          docker run --rm --network nodejs-smoke-net --entrypoint node -e TEST_DATABASE_URL="postgresql://postgres:$db_password@nodejs-postgres:5432/makan" "$IMAGE" --test store.integration.test.js
          docker run --rm --entrypoint node "$IMAGE" --test app.test.js
          docker run -d --name nodejs-smoke --network nodejs-smoke-net -p 127.0.0.1:3000:3000 -e APP_VERSION="$APP_TAG" -e DATABASE_URL="postgresql://postgres:$db_password@nodejs-postgres:5432/makan" -e ADMIN_TOKEN="$admin_token" "$IMAGE"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz | grep -qx ok
          curl -fsS http://127.0.0.1:3000/readyz | grep -qx ready
          curl -fsS http://127.0.0.1:3000/ | grep -q 'makan'
          curl -fsS http://127.0.0.1:3000/api/version | jq -e --arg version "$APP_TAG" '.version == $version'
          curl -fsS http://127.0.0.1:3000/api/properties | jq -e '.properties | length == 6'
          inquiry="$(curl -fsS -X POST http://127.0.0.1:3000/api/properties/garden-residence/inquiries -H 'Content-Type: application/json' --data '{"name":"CI Sample","phone":"01000000000","message":"Smoke test"}')"
          jq -e '.status == "new" and (.id | length > 0)' <<<"$inquiry"
          docker restart nodejs-smoke
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/admin/inquiries -H "Authorization: Bearer $admin_token" | jq -e --arg id "$(jq -r .id <<<"$inquiry")" '.inquiries | any(.id == $id)'
          curl -fsS http://127.0.0.1:3000/metrics -o /tmp/metrics-3000.txt
          grep -q '^http_requests_total' /tmp/metrics-3000.txt
      - name: Scan Node.js image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          version: v0.76.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish tested Node.js image
        id: publish
        env:
          IMAGE: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Node.js image provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ secrets.USERNAME }}/nodejs
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  build-golang:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: golang/go.mod
          cache-dependency-path: golang/go.sum
      - name: Test Go application
        working-directory: golang
        run: |
          go test ./...
          go vet ./...
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Go image
        uses: docker/build-push-action@v7
        with:
          context: ./golang
          file: ./golang/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=golang
          cache-to: type=gha,mode=max,scope=golang
      - name: Smoke test Go image
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          APP_TAG: sha-${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f golang-smoke golang-smoke-db >/dev/null 2>&1 || true; docker network rm golang-smoke-network >/dev/null 2>&1 || true' EXIT
          docker network create golang-smoke-network
          docker run -d --name golang-smoke-db --network golang-smoke-network \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=learning \
            --health-cmd='pg_isready -U postgres -d learning' --health-interval=2s \
            --health-timeout=2s --health-retries=30 postgres:18.6-alpine
          for attempt in {1..60}; do
            if docker inspect -f '{{.State.Health.Status}}' golang-smoke-db | grep -qx healthy; then break; fi
            sleep 1
          done
          docker exec golang-smoke-db pg_isready -U postgres -d learning
          docker exec golang-smoke-db psql --set=ON_ERROR_STOP=1 --username postgres --dbname learning \
            --command='CREATE SCHEMA app;'
          docker run -d --name golang-smoke --network golang-smoke-network \
            -p 127.0.0.1:8080:8080 -p 127.0.0.1:9090:9090 \
            -e APP_VERSION="$APP_TAG" -e DATABASE_URL='postgres://postgres:postgres@golang-smoke-db:5432/learning?sslmode=disable' \
            -e OIDC_ISSUER='https://learn.example.test/auth/realms/learning-lab' \
            -e OIDC_INTERNAL_ISSUER='http://keycloak:8080/auth/realms/learning-lab' \
            -e OIDC_CLIENT_ID=learning-lab-web -e OIDC_CALLBACK_URL='https://learn.example.test/api/auth/callback' \
            -e COOKIE_SECURE=false "$IMAGE"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null | grep -qx ok; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok; then
            docker logs golang-smoke
            exit 1
          fi
          bash scripts/check-learning-content.sh http://127.0.0.1:8080
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = 404
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:9090/metrics -o /tmp/metrics-9090.txt; then break; fi
            sleep 1
          done
          grep -q '^learning_lab_http_requests_total' /tmp/metrics-9090.txt
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy:.*script-src 'self'"
          docker rm -f golang-smoke >/dev/null
          docker rm -f golang-smoke-db >/dev/null
          docker network rm golang-smoke-network >/dev/null
      - name: Scan Go image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          version: v0.76.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish tested Go image
        id: publish
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Go image provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ secrets.USERNAME }}/golang
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  build-keycloak:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build optimized Keycloak image
        uses: docker/build-push-action@v7
        with:
          context: ./golang/deploy/keycloak
          file: ./golang/deploy/keycloak/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.USERNAME }}/golang:keycloak-sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=keycloak-learning-lab
          cache-to: type=gha,mode=max,scope=keycloak-learning-lab
      - name: Smoke test optimized Keycloak image
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:keycloak-sha-${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f keycloak-smoke keycloak-smoke-db >/dev/null 2>&1 || true; docker network rm keycloak-smoke-network >/dev/null 2>&1 || true' EXIT
          docker network create keycloak-smoke-network
          docker run -d --name keycloak-smoke-db --network keycloak-smoke-network \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=keycloak \
            --health-cmd='pg_isready -U postgres -d keycloak' --health-interval=2s \
            --health-timeout=2s --health-retries=30 postgres:18.6-alpine
          for attempt in {1..60}; do
            if docker inspect -f '{{.State.Health.Status}}' keycloak-smoke-db | grep -qx healthy; then break; fi
            sleep 1
          done
          docker exec keycloak-smoke-db pg_isready -U postgres -d keycloak
          docker run -d --name keycloak-smoke --network keycloak-smoke-network \
            -p 127.0.0.1:8081:8080 -p 127.0.0.1:9000:9000 \
            -e KC_DB_URL='jdbc:postgresql://keycloak-smoke-db:5432/keycloak' \
            -e KC_DB_USERNAME=postgres -e KC_DB_PASSWORD=postgres \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME=http://localhost:8081/auth \
            -e KC_HOSTNAME_ADMIN=http://localhost:8081/auth -e KC_HOSTNAME_STRICT=false \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=smoke-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 24)" \
            "$IMAGE" start --optimized
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:9000/auth/health/ready -o /tmp/keycloak-health.json 2>/dev/null; then break; fi
            sleep 1
          done
          if ! jq -e '.status == "UP"' /tmp/keycloak-health.json >/dev/null 2>&1; then
            docker logs keycloak-smoke
            exit 1
          fi
          curl -fsS http://127.0.0.1:8081/auth/realms/master/.well-known/openid-configuration \
            | jq -e '.issuer | startswith("http://localhost:8081/auth/realms/master")' >/dev/null
          docker rm -f keycloak-smoke >/dev/null
          docker rm -f keycloak-smoke-db >/dev/null
          docker network rm keycloak-smoke-network >/dev/null
      - name: Scan Keycloak image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.USERNAME }}/golang:keycloak-sha-${{ needs.prepare.outputs.short_sha }}
          version: v0.76.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish tested Keycloak image
        id: publish
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:keycloak-sha-${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Keycloak image provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ secrets.USERNAME }}/golang
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  update-helm-values:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-nodejs
      - build-golang
      - build-keycloak
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase on latest main
        run: git pull --rebase origin main
      - name: Update Helm image tags
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          sed -i -E \
            "s|^([[:space:]]*tag:[[:space:]]*).*|\1\"sha-${SHORT_SHA}\"|" \
            charts/values-node.yaml
          sed -i -E \
            "s|^  tag:.*|  tag: \"sha-${SHORT_SHA}\"|" \
            golang/deploy/chart/values.yaml
          sed -i -E \
            "s|^    tag:.*|    tag: \"keycloak-sha-${SHORT_SHA}\"|" \
            golang/deploy/chart/values.yaml
      - name: Commit and push Helm values
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/values-node.yaml golang/deploy/chart/values.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "chore: update image tags to sha-${SHORT_SHA}"
          git push origin HEAD:main
      # Commits made with GITHUB_TOKEN do not trigger push workflows.
      - name: Validate promoted values
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run platform-validation.yml --ref main
