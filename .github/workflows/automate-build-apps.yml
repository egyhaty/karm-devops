name: Build and Promote Applications

on:
  push:
    branches:
      - main
    paths:
      - 'golang/**'
      - 'nodejs/**'
      - '.github/workflows/automate-build-apps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-promote-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Prepare image tag
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-nodejs:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Node.js image
        uses: docker/build-push-action@v7
        with:
          context: ./nodejs
          file: ./nodejs/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=nodejs
          cache-to: type=gha,mode=max,scope=nodejs
      - name: Smoke test Node.js image
        env:
          IMAGE: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          APP_TAG: sha-${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f nodejs-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name nodejs-smoke -p 127.0.0.1:3000:3000 -e APP_VERSION="$APP_TAG" "$IMAGE"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz | grep -qx ok
          curl -fsS http://127.0.0.1:3000/ | grep -Fx "version=$APP_TAG"
          curl -fsS http://127.0.0.1:3000/metrics -o /tmp/metrics-3000.txt
          grep -q '^http_requests_total' /tmp/metrics-3000.txt
      - name: Scan Node.js image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
          version: v0.76.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish tested Node.js image
        id: publish
        env:
          IMAGE: ${{ secrets.USERNAME }}/nodejs:sha-${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Node.js image provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ secrets.USERNAME }}/nodejs
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  build-golang:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
      - name: Build and push Go image
        uses: docker/build-push-action@v7
        with:
          context: ./golang
          file: ./golang/Dockerfile
          push: false
          load: true
          tags: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          cache-from: type=gha,scope=golang
          cache-to: type=gha,mode=max,scope=golang
      - name: Smoke test Go image
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          APP_TAG: sha-${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f golang-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name golang-smoke -p 127.0.0.1:8080:8080 -e APP_VERSION="$APP_TAG" "$IMAGE"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -qx ok
          curl -fsS http://127.0.0.1:8080/ | grep -Fx "version=$APP_TAG"
          curl -fsS http://127.0.0.1:8080/metrics -o /tmp/metrics-8080.txt
          grep -q '^http_requests_total' /tmp/metrics-8080.txt
      - name: Scan Go image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
          version: v0.76.0
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Publish tested Go image
        id: publish
        env:
          IMAGE: ${{ secrets.USERNAME }}/golang:sha-${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest Go image provenance
        uses: actions/attest@v4.2.2
        with:
          subject-name: docker.io/${{ secrets.USERNAME }}/golang
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  update-helm-values:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-nodejs
      - build-golang
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase on latest main
        run: git pull --rebase origin main
      - name: Update Helm image tags
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          for file in charts/values-node.yaml charts/values-go.yaml; do
            sed -i -E \
              "s|^([[:space:]]*tag:[[:space:]]*).*|\1\"sha-${SHORT_SHA}\"|" \
              "$file"
          done
      - name: Commit and push Helm values
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/values-node.yaml charts/values-go.yaml
          if git diff --cached --quiet; then
            echo "No image tag changes to commit"
            exit 0
          fi
          git commit -m "chore: update image tags to sha-${SHORT_SHA}"
          git push origin HEAD:main
      # Commits made with GITHUB_TOKEN do not trigger push workflows.
      - name: Validate promoted values
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run platform-validation.yml --ref main
