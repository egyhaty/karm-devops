name: Platform Validation

on:
  pull_request:
  push:
    branches:
      - main
      - ci-validation

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=(charts/*)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No charts found under charts/"
            exit 0
          fi
          for chart in "${charts[@]}"; do
            if [ -f "$chart/Chart.yaml" ]; then
              helm lint "$chart"
            fi
          done

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Parse YAML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import yaml

          excluded = {'.git'}
          files = [p for p in pathlib.Path('.').rglob('*') if p.is_file() and p.suffix in {'.yaml', '.yml'} and not excluded.intersection(p.parts)]
          errors = []
          for path in files:
              try:
                  with path.open(encoding='utf-8') as stream:
                      list(yaml.safe_load_all(stream))
              except Exception as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)
          print(f'Validated {len(files)} YAML files')
          PY

  security:
    name: Secret and IaC scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
