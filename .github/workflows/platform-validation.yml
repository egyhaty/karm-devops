name: Platform Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'argocd/**'
      - 'cert-manager/**'
      - 'charts/**'
      - 'monitoring/**'
      - 'storage/**'
      - 'sealed-secrets/**'
      - 'terraform/**'
      - 'traefik/**'
      - 'networking/**'
      - 'infrastructure/**'
      - 'golang/**'
      - 'nodejs/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/automate-build-apps.yml'
      - '.github/workflows/platform-validation.yml'
      - '.gitleaks.toml'
  push:
    branches: [main]
    paths:
      - 'argocd/**'
      - 'cert-manager/**'
      - 'charts/**'
      - 'monitoring/**'
      - 'storage/**'
      - 'sealed-secrets/**'
      - 'terraform/**'
      - 'traefik/**'
      - 'networking/**'
      - 'infrastructure/**'
      - 'golang/**'
      - 'nodejs/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/automate-build-apps.yml'
      - '.github/workflows/platform-validation.yml'
      - '.gitleaks.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-contracts:
    name: Application and content checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: makan_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d makan_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test && npm run test:integration
        working-directory: nodejs
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-disposable-only@localhost:5432/makan_test
      - run: npm ci && npm test
        working-directory: golang/content
      - name: Ensure generated lessons match Markdown
        run: git diff --exit-code -- golang/web/lessons golang/web/content-source golang/web/library-index.json

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Lint application values
        run: |
          helm lint charts -f charts/values-node.yaml
          helm lint golang/deploy/chart

  yaml:
    name: Bash and YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          version='v4.54.1'
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64" -o /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq
          yq --version
          jq --version
      - name: Check YAML, topology, and availability settings
        run: bash scripts/validate-platform.sh
      - name: Check shell syntax
        run: bash -n scripts/*.sh

  kubernetes:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          version='v4.54.1'
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64" -o /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq
          yq --version
          jq --version
      - name: Render workloads and export upstream CRD schemas
        run: bash scripts/render-platform.sh
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubernetes_version="$(yq -r '.cluster.kubernetesVersion | sub("^v"; "")' infrastructure/nodes.yaml)"
          kubeconform -strict -summary -kubernetes-version "$kubernetes_version" \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/
          mapfile -t files < <(git ls-files '*.yaml' | grep -E '^(argocd/apps/|cert-manager/|monitoring/|networking/metallb/|networking/policies/|sealed-secrets/|traefik/)' | grep -v '/values.yaml$')
          kubeconform -strict -summary -kubernetes-version "$kubernetes_version" \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${files[@]}"
      - name: Shell script syntax
        run: bash -n scripts/bootstrap-node.sh scripts/prepare-storage-node.sh scripts/render-platform.sh scripts/validate-platform.sh scripts/export-crd-schemas.sh scripts/export-kubernetes-schema.sh scripts/use-local-control-plane-api.sh

  security:
    name: Secret and IaC scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.24.2'
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
      - name: Trivy config report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          version: v0.76.0
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.txt
          if-no-files-found: warn
      - name: Show Trivy findings
        if: always()
        run: cat trivy-config.txt
