name: Platform Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'argocd/**'
      - 'cert-manager/**'
      - 'charts/**'
      - 'monitoring/**'
      - 'storage/**'
      - 'sealed-secrets/**'
      - 'terraform/**'
      - 'traefik/**'
      - 'networking/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/automate-build-apps.yml'
      - '.github/workflows/platform-validation.yml'
      - '.gitleaks.toml'
      - '.yamllint.yml'
  push:
    branches:
      - main
    paths:
      - 'argocd/**'
      - 'cert-manager/**'
      - 'charts/**'
      - 'monitoring/**'
      - 'storage/**'
      - 'sealed-secrets/**'
      - 'terraform/**'
      - 'traefik/**'
      - 'networking/**'
      - 'infrastructure/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/automate-build-apps.yml'
      - '.github/workflows/platform-validation.yml'
      - '.gitleaks.toml'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint application values
        run: |
          helm lint charts -f charts/values-go.yaml
          helm lint charts -f charts/values-node.yaml

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install YAML tools
        run: python -m pip install --disable-pip-version-check PyYAML yamllint
      - name: Check YAML, topology, and availability settings
        run: python scripts/validate-platform.py
      - name: Run yamllint on source YAML
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.yml' '*.yaml' | grep -vE '(^|/)(vendor|rendered|templates)/' || true)
          if [ ${#files[@]} -eq 0 ]; then echo 'No source YAML files found'; exit 0; fi
          yamllint -c .yamllint.yml "${files[@]}"

  kubernetes:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Render workloads and export upstream CRD schemas
        run: bash scripts/render-platform.sh
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail
          kubernetes_version="$(python3 -c 'import yaml; print(yaml.safe_load(open("infrastructure/nodes.yaml", encoding="utf-8"))["cluster"]["kubernetesVersion"].removeprefix("v"))')"
          kubeconform -strict -summary -kubernetes-version "$kubernetes_version" \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/
          mapfile -t files < <(git ls-files '*.yaml' | grep -E '^(argocd/apps/|cert-manager/|monitoring/|networking/metallb/|networking/policies/|sealed-secrets/|traefik/)' | grep -v '/values.yaml$')
          kubeconform -strict -summary -kubernetes-version "$kubernetes_version" \
            -schema-location default \
            -schema-location 'schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "${files[@]}"
      - name: Shell script syntax
        run: bash -n scripts/bootstrap-node.sh scripts/prepare-storage-node.sh scripts/render-platform.sh scripts/use-local-control-plane-api.sh

  security:
    name: Secret and IaC scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.24.2'
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
      - name: Trivy config report
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.txt
          if-no-files-found: warn
