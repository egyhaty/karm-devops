name: Platform Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci-hardening
      - ci-hardening-fix

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then helm lint "$chart"; fi
          done

  yaml:
    name: YAML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML tools
        run: python -m pip install --disable-pip-version-check PyYAML yamllint
      - name: Parse source YAML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import yaml
          excluded = {'.git', 'templates', 'rendered', 'vendor'}
          files = [p for p in pathlib.Path('.').rglob('*') if p.is_file() and p.suffix in {'.yaml', '.yml'} and not excluded.intersection(p.parts)]
          errors = []
          for path in files:
              try:
                  with path.open(encoding='utf-8') as stream: list(yaml.safe_load_all(stream))
              except Exception as exc: errors.append(f'{path}: {exc}')
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print(f'Parsed {len(files)} source YAML files')
          PY
      - name: Run yamllint on source YAML
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.yml' '*.yaml' | grep -vE '(^|/)(vendor|rendered|templates)/' || true)
          if [ ${#files[@]} -eq 0 ]; then echo 'No source YAML files found'; exit 0; fi
          yamllint -c .yamllint.yml "${files[@]}"

  kubernetes:
    name: Kubernetes schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Render Helm charts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          shopt -s nullglob
          for chart in charts/*; do
            if [ -f "$chart/Chart.yaml" ]; then helm template "$(basename "$chart")" "$chart" > "rendered/$(basename "$chart").yaml"; fi
          done
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          version='0.6.7'
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -output text rendered/

  security:
    name: Secret and IaC scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy config report
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          hide-progress: true
          format: table
          output: trivy-config.txt
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.txt
          if-no-files-found: warn
