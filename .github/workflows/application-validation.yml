name: Application Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'golang/**'
      - 'nodejs/**'
      - '.github/workflows/application-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'golang/**'
      - 'nodejs/**'
      - '.github/workflows/application-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-go:
    name: Build Go application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: golang/go.mod
          cache: true
      - name: Build
        working-directory: golang
        run: go build ./...

  build-node:
    name: Build Node.js application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - name: Install dependencies
        working-directory: nodejs
        run: npm ci
      - name: Build
        working-directory: nodejs
        run: npm run build --if-present
      - name: Test
        working-directory: nodejs
        run: npm test --if-present
