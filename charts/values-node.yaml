config:
  app: nodejs

replicaCount: 3

image:
  repository: egyhaty/nodejs
  tag: "sha-c3d884d"
  pullPolicy: IfNotPresent

service:
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: node.murabba.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: node-murabba-net-tls
      hosts:
        - node.murabba.net

certificate:
  enabled: true
  name: node-murabba-net
  secretName: node-murabba-net-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - node.murabba.net

pdb:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
  labels:
    release: monitoring
  path: /metrics
  interval: 30s

prometheusRule:
  enabled: true
  labels:
    release: monitoring
  memoryLimitBytes: "134217728"

scaling:
  enabled: true
  min: 3
  max: 6
  targetCPUUtilizationPercentage: 70
