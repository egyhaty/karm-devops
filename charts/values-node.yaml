config:
  app: nodejs

replicaCount: 3

image:
  repository: egyhaty/nodejs
  tag: "sha-53b16d1"
  pullPolicy: IfNotPresent

service:
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: node.murabba.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: node-murabba-net-tls
      hosts:
        - node.murabba.net
