config:
  app: nodejs

replicaCount: 3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: nodejs
        app.kubernetes.io/name: nodejs

image:
  repository: egyhaty/nodejs
  tag: "sha-68acec8"
  pullPolicy: IfNotPresent

service:
  targetPort: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: makan.murabba.net
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: makan-murabba-net-tls
      hosts:
        - makan.murabba.net

certificate:
  enabled: true
  name: makan-murabba-net
  secretName: makan-murabba-net-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - makan.murabba.net

pdb:
  enabled: true
  minAvailable: 2

serviceMonitor:
  enabled: true
  labels:
    release: monitoring
  path: /metrics
  interval: 30s

prometheusRule:
  enabled: true
  labels:
    release: monitoring
  memoryLimitBytes: "134217728"

scaling:
  enabled: true
  min: 3
  max: 6
  targetCPUUtilizationPercentage: 70

# Create the SealedSecret described in nodejs/README.md before promoting this version.
extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: nodejs-property-secrets
        key: database-url
  - name: ADMIN_TOKEN
    valueFrom:
      secretKeyRef:
        name: nodejs-property-secrets
        key: admin-token

propertyDatabase:
  enabled: true
  secretName: nodejs-property-secrets

probes:
  readiness:
    path: /readyz
