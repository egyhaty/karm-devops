{{- if .Values.propertyDatabase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
data:
  01-app-role.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username postgres --dbname makan --set=app_password="$APP_DB_PASSWORD" <<'SQL'
    CREATE ROLE makan LOGIN PASSWORD :'app_password';
    GRANT CONNECT ON DATABASE makan TO makan;
    GRANT USAGE, CREATE ON SCHEMA public TO makan;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.propertyDatabase.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: makan
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.propertyDatabase.secretName }}
                  key: postgres-password
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.propertyDatabase.secretName }}
                  key: app-db-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U postgres -d makan']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U postgres -d makan']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U postgres -d makan']
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-app-role.sh
              subPath: 01-app-role.sh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          recurring-job-group.longhorn.io/default: enabled
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.propertyDatabase.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.propertyDatabase.storageSize | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-postgres
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "charts.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-database-egress
spec:
  podSelector:
    matchLabels:
      {{- include "charts.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Release.Name }}-postgres
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
