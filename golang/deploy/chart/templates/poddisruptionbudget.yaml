{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: learning-lab
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "learning-lab.selectorLabels" . | nindent 6 }}
{{- end }}
