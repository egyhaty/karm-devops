{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: learning-lab
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.release }}
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "learning-lab.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: learning-lab-keycloak
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.release }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "learning-lab.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: identity
  endpoints:
    - port: management
      path: /auth/metrics
      interval: 30s
{{- end }}
