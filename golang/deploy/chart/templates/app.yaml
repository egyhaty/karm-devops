apiVersion: v1
kind: Service
metadata:
  name: learning-lab
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  selector:
    {{- include "learning-lab.selectorLabels" . | nindent 4 }}
  ports:
    - name: web
      port: 8080
      targetPort: web
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-lab
  labels:
    {{- include "learning-lab.labels" . | nindent 4 }}
spec:
  {{- if not .Values.scaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "learning-lab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "learning-lab.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: web
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: app-db-password
            - name: DATABASE_URL
              value: postgres://learning_app:$(APP_DB_PASSWORD)@postgres:5432/learning?sslmode=disable&search_path=app
            - name: OIDC_ISSUER
              value: https://{{ .Values.host }}/auth/realms/{{ .Values.oidc.realm }}
            - name: OIDC_INTERNAL_ISSUER
              value: http://keycloak.learning-lab.svc.cluster.local:8080/auth/realms/{{ .Values.oidc.realm }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: OIDC_CALLBACK_URL
              value: https://{{ .Values.host }}/api/auth/callback
            - name: COOKIE_SECURE
              value: "true"
            - name: SESSION_TTL
              value: 8h
            - name: WEB_DIRECTORY
              value: /app/web
          startupProbe:
            httpGet:
              path: /healthz
              port: web
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
