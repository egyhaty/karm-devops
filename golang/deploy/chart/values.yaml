nameOverride: learning-lab

image:
  repository: egyhaty/golang
  tag: "sha-11bb911"
  pullPolicy: IfNotPresent

replicaCount: 2
scaling:
  enabled: true
  min: 2
  max: 4
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: learning-lab
        app.kubernetes.io/instance: golang

host: learn.murabba.net
tlsSecretName: learn-murabba-net-tls
secretName: learning-lab-secrets

certificate:
  issuerName: letsencrypt-prod

storage:
  className: longhorn
  size: 10Gi

postgres:
  image: postgres:18.6-alpine
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

keycloak:
  image:
    repository: egyhaty/golang
    tag: "keycloak-sha-11bb911"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "2", memory: 1536Mi }

app:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

serviceMonitor:
  enabled: true
  release: monitoring

networkPolicy:
  enabled: true

# Public hostname and in-cluster OIDC back-channel URL.
oidc:
  realm: learning-lab
  clientId: learning-lab-web
