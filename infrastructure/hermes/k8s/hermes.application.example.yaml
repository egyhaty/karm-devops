# PREPARATION TEMPLATE. Do not put this under argocd/apps until reviewed.
# Existing parent app automatically syncs that directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-karem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/egyhaty/karm-devops.git
    targetRevision: REPLACE_REVIEWED_COMMIT
    path: infrastructure/hermes/deploy
    directory:
      recurse: false
      include: manifest.json
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      enabled: false
    syncOptions:
      - CreateNamespace=true
