apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-values
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: app-of-apps
spec:
  project: default
  source:
    repoURL: https://github.com/egyhaty/karm-devops.git
    targetRevision: main
    path: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
