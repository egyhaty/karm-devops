apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-backups
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  labels:
    app.kubernetes.io/part-of: app-of-apps
spec:
  project: default
  source:
    repoURL: https://github.com/egyhaty/karm-devops.git
    targetRevision: main
    path: storage/longhorn/resources
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
