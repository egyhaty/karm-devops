apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golang
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/egyhaty/karm-devops.git
    targetRevision: main
    path: golang/deploy/chart
    helm:
      releaseName: golang
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: learning-lab
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
