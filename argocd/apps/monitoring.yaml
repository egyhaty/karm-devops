apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: app-of-apps

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.4.0
    helm:
      releaseName: monitoring
      values: |
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password

        alertmanager:
          enabled: true
          alertmanagerSpec:
            configSecret: alertmanager-monitoring-kube-prometheus-alertmanager
            secrets:
              - alertmanager-slack-webhook

          config:
            global:
              resolve_timeout: 5m

            route:
              receiver: "null"
              group_by:
                - alertname
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h

              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"

                - receiver: slack
                  matchers:
                    - severity =~ "critical|warning"

            receivers:
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack-webhook-url
                    send_resolved: true

              - name: "null"

        additionalPrometheusRulesMap:
          application-deployment-alerts:
            groups:
              - name: application-deployment-alerts
                rules:
                  - alert: ApplicationDeploymentUnavailable
                    expr: kube_deployment_status_replicas_available{namespace="default",deployment=~"golang|nodejs"} < kube_deployment_spec_replicas{namespace="default",deployment=~"golang|nodejs"}
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Application deployment has unavailable replicas"
                      description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has fewer available replicas than requested for more than 5 minutes."

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 7d
            retentionSize: 4GB

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
