apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: app-of-apps

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.4.0
    helm:
      releaseName: monitoring
      values: |
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password

        alertmanager:
          enabled: true
          alertmanagerSpec:
            secrets:
              - alertmanager-slack-webhook

          config:
            global:
              resolve_timeout: 5m

            route:
              receiver: slack
              group_by:
                - alertname
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h

            receivers:
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack-webhook-url
                    send_resolved: true
                    title: '{{ template "slack.default.title" . }}'
                    text: '{{ template "slack.default.text" . }}'

        prometheus:
          enabled: true
          prometheusSpec:
            retention: 7d
            retentionSize: 4GB

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
