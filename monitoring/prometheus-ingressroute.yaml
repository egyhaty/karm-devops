apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`prometheus.murabba.net`)
      kind: Rule

      middlewares:
        - name: prometheus-auth

      services:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090

  tls:
    secretName: prometheus-murabba-net-tls
